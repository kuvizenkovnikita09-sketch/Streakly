<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моя статистика — Streakly</title>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="stats">
  <header class="header"><div class="wrap">
    <a class="logo" href="index.html">Streakly</a>
    <nav class="nav" id="nav"></nav>
  </div></header>
  <div class="layout">
    <aside class="side" id="side"></aside>
    <main class="content page">
      <h1 class="hi">Моя статистика</h1>
      <section class="card">
        <div class="filters" id="statsFilters"></div>
        <div class="cal-head">
          <button class="btn btn-ghost" data-nav="-1" aria-label="Предыдущий месяц">‹</button>
          <h2 id="monthTitle"></h2>
          <button class="btn btn-ghost" data-nav="1" aria-label="Следующий месяц">›</button>
        </div>
        <div class="calendar" id="calendar"></div>
        <ul class="legend">
          <li><i class="ms"></i>не выполнено</li>
          <li><i class="pt"></i>выполнено частично</li>
          <li><i class="ok"></i>норма выполнена</li>
          <li><i class="ov"></i>сверх нормы</li>
        </ul>
      </section>
      <section class="card">
        <h2>Итоги месяца</h2>
        <p class="sub" id="monthSub"></p>
        <div class="tiles" id="monthStats"></div>
      </section>
    </main>
  </div>
  <script src="js/courses.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
